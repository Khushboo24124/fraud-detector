# Motor-insurance domain rules. Another domain (health, property) = another file like this.
domain: vehicle

document_types:
  invoice: ["invoice", "tax invoice", "repair bill", "estimate", "garage", "workshop", "service centre"]
  rc: ["registration certificate", "certificate of registration", "regn. no", "chassis no", "engine no"]
  licence: ["driving licence", "driving license", "dl no", "licence no", "valid till"]
  id_card: ["aadhaar", "aadhar", "unique identification", "income tax department", "permanent account number",
            "election commission", "elector", "voter", "passport", "identity card"]
  claim_form: ["claim form", "claim intimation", "policy no", "date of accident"]

fields:
  # Indian registration plate, e.g. MH 12 AB 1234, KA-05-MN-4321, DL3CAB1234
  vehicle_no: '\b([A-Z]{2})[\s\-]?(\d{1,2})[\s\-]?([A-Z]{1,3})[\s\-]?(\d{4})\b'
  invoice_no: '(?:invoice|bill)\s*(?:no\.?|number|#)\s*[:\-]?\s*([A-Z0-9\-/]{3,})'
  date: '\b(\d{1,2})[\-/\.](\d{1,2})[\-/\.](\d{2,4})\b'
  amount: '(?:₹|rs\.?|inr)?\s*([0-9]{1,3}(?:,[0-9]{2,3})*(?:\.[0-9]{1,2})|[0-9]+(?:\.[0-9]{1,2}))'
  name_labels: ["owner name", "owner", "customer name", "customer", "name of owner", "insured name", "name"]
  total_labels: ["grand total", "total amount", "net payable", "amount payable", "total"]
  subtotal_labels: ["sub total", "subtotal", "taxable amount"]
  tax_labels: ["gst", "cgst", "sgst", "igst", "tax"]

# Arithmetic and anomaly-model checks are tuned on Indian GST invoices. On documents without any
# of these markers (e.g. foreign shop receipts) they misfired on 44-71% of *genuine* receipts in
# the Find it again! evaluation, so they are skipped there and the skip is shown as a note.
domain_markers: ["gstin", "cgst", "sgst", "igst", "₹", "inr"]

consistency:
  vehicle_no_must_match: true
  owner_name_must_match: true
  invoice_after_accident: true
  max_days_accident_to_invoice: 120
  amount_tolerance: 1.0   # rupees
